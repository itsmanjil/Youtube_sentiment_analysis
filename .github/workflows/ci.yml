name: CI

on:
  pull_request:
  push:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install lint/audit tooling
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Ruff (unused imports/vars, undefined names)
        run: ruff check .
      # --ignore-vuln PYSEC-2026-597 excludes the nltk 3.9.4 (latest as of
      # writing) path-traversal CVE-2026-12243, which has no fix release yet
      # (see requirements.txt's nltk pin comment) — remove the ignore once a
      # patched nltk ships.
      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-597

  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Backend test suite
        run: python manage.py test app app_api users

  research-smoke:
    # Classical-model research/ci scripts are never exercised by `manage.py
    # test` (that suite mocks the sentiment engines) and have no other CI
    # coverage, so a refactor of src/sentiment or src/preprocessing can
    # silently break them. Run the lightweight ones end-to-end (small sample
    # sizes) against the models/data already committed in the repo, so a
    # broken import or signature change fails the build instead of only
    # surfacing the next time someone runs the script by hand.
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Split leakage check
        run: >
          python scripts/prepare/check_split_leakage.py
          --train data/train.csv --val data/val.csv --test data/test.csv
      - name: Temperature scaling smoke run (classical + ensemble + meta-learner)
        run: >
          python research/ci/temperature_scaling.py
          --sample_val 200 --sample_test 200
          --output /tmp/research-smoke/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend test suite
        run: npm test -- --run
      - name: Production build
        run: npm run build
