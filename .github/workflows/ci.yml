name: CI

on:
  pull_request:
  push:

jobs:
  research-smoke:
    # Classical-model research/ci scripts have no other CI coverage, so a
    # refactor of src/sentiment or src/preprocessing can silently break them.
    # Run the lightweight ones end-to-end (small sample sizes) against the
    # models/data already committed in the repo, so a broken import or
    # signature change fails the build instead of only surfacing the next
    # time someone runs the script by hand.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Split leakage check
        run: >
          python scripts/prepare/check_split_leakage.py
          --train data/train.csv --val data/val.csv --test data/test.csv
      - name: Temperature scaling smoke run (classical + ensemble + meta-learner)
        run: >
          python research/ci/temperature_scaling.py
          --sample_val 200 --sample_test 200
          --output /tmp/research-smoke/

  notebooks-smoke:
    # The notebooks are the thesis defense artifact — they must always
    # execute cleanly against the committed results/figures. This catches a
    # moved/renamed results file or a broken _common.py path before it's
    # discovered live in the viva.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notebooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r ../backend/requirements.txt
      - name: Execute all notebooks
        run: python -m jupyter nbconvert --to notebook --execute --output-dir /tmp/notebooks-smoke *.ipynb
