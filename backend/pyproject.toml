[tool.ruff]
target-version = "py311"
extend-exclude = ["venv", "migrations"]

[tool.ruff.lint]
# Pyflakes only: unused imports, unused variables, undefined names, etc.
# Deliberately not enabling style rules (E/W line length, import sorting,
# docstring conventions) — this is a correctness gate, not a reformat.
select = ["F"]
ignore = [
    # 15 pre-existing "assigned but never used" violations in research/
    # scripts (as of 2026-07-18) need manual triage before this can be
    # enforced — some assign a value only for its side effect or for
    # readability, others may be genuinely dead. Run
    # `ruff check --select F841` to see the current list. The two instances
    # that were unambiguously safe (unused `except ... as exc` bindings)
    # were fixed directly instead of ignored.
    "F841",
]
