[tool.ruff]
target-version = "py311"
extend-exclude = ["venv", "migrations"]

[tool.ruff.lint]
# Pyflakes only: unused imports, unused variables, undefined names, etc.
# Deliberately not enabling style rules (E/W line length, import sorting,
# docstring conventions) — this is a correctness gate, not a reformat.
select = ["F"]
ignore = [
    # 14 pre-existing "assigned but never used" violations, all in research/
    # scripts (as of 2026-07-21), need manual triage before this can be
    # enforced — some assign a value only for its side effect or for
    # readability, others may be genuinely dead. Run
    # `ruff check --select F841` to see the current list. The unambiguously
    # safe instances outside research/ (unused `except ... as exc` bindings
    # and an unused `with patch(...) as` binding in app/tests.py) were fixed
    # directly instead of ignored, so this ignore now covers research/ only.
    "F841",
]
